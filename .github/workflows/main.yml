name: Build minitouch

# 触发条件：当推送 tag 时触发，或者手动触发（workflow_dispatch）
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动输入 tag 名称（如 v1.0.0）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. 检出代码（由于 minitouch 包含子模块，需要开启 submodules）
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: 'free-abrams/minitouch'
        submodules: 'recursive'

    # 2. 设置 Android NDK 环境
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '21.4.7075529'

    # 3. 使用 ndk-build 进行编译
    - name: Build with ndk-build
      run: |
        $ANDROID_NDK_HOME/ndk-build

    # 4. 检查编译出的产物（可选，方便在日志中查看是否成功）
    - name: Check Build Artifacts
      run: |
        echo "=== Generated Binaries ==="
        ls -R libs/

    # 5. 将编译好的二进制文件打包
    - name: Package Binaries
      run: |
        cd libs
        zip -r ../minitouch-binaries.zip .
        cd ..

    # 6. 获取 tag 名称
    - name: Get Tag Name
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    # 7. 创建 Release 并上传产物
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_tag.outputs.tag }}
        name: Release ${{ steps.get_tag.outputs.tag }}
        body: |
          minitouch 编译产物 - ${{ steps.get_tag.outputs.tag }}
        files: minitouch-binaries.zip
        make_latest: true